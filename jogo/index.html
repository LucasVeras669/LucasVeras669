<title>Fight Flow Brutal</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="Jogo de luta 1x1 em pixel art com combate free flow: boxe contra taekwondo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: tela cheia de jogo, canvas de baixa resolução escalado em pixels, HUD e controles por cima */
:root{
  --t:1;--u:1;--m:1;
  --ink:#0d0b12; --paper:#efe6d2; --amber:#f2a93b; --blood:#d8402f; --steel:#7fd6ff; --glass:rgba(239,230,210,.12);
  --display:"Jost","Helvetica Neue",Arial,sans-serif; --body:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;background:var(--ink);font-family:var(--body)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.fbar{display:flex;flex-direction:column;gap:calc(4px*var(--t));min-width:0}
.fbar.r{align-items:flex-end;text-align:right}
.fname{font-family:var(--display);font-size:calc(11.2px*var(--t));letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hp{width:100%;max-width:calc(280px*var(--t));height:calc(12px*var(--t));background:var(--ink);border:2px solid var(--paper);box-shadow:0 2px 0 var(--ink);position:relative;overflow:hidden}
.hp i{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--amber);transition:width .12s steps(6)}
.hp b{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--blood);transition:width .7s .25s}
.fbar.r .hp i,.fbar.r .hp b{left:auto;right:0}
.erow{display:flex;align-items:center;gap:calc(8px*var(--t));flex-direction:row-reverse}
.ai{display:flex;align-items:center;gap:calc(4px*var(--t));font-family:var(--display);font-size:calc(8.2px*var(--t));letter-spacing:.1em;color:#ff9a5a;text-shadow:0 2px 0 var(--ink)}
.aib{width:calc(54px*var(--t));height:calc(6px*var(--t));border:2px solid #ff9a5a;background:var(--ink);overflow:hidden}
.ai.sp{color:#ff5d5d}.ai.sp .aib{border-color:#ff5d5d}.ai.sp .aib i{background:#ff2a2a}.ai.sp.full .aib{animation:pulse .4s steps(2) infinite}
.aib i{display:block;height:100%;width:0;background:#ff5d3a;transition:width .4s}
.wins{display:flex;gap:calc(4px*var(--t))}
.wins span{width:calc(8px*var(--t));height:calc(8px*var(--t));border:2px solid var(--paper);background:transparent}
.wins span.on{background:var(--amber)}
#mid{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display)}
#rlabel{font-size:calc(10.2px*var(--t));letter-spacing:.15em;opacity:.8}
#score{font-size:calc(10.2px*var(--t));font-variant-numeric:tabular-nums;opacity:.8}
#combo{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:calc(56px + env(safe-area-inset-top,0px));pointer-events:none;
  font-family:var(--display);line-height:1}
#cWrap{opacity:0;transition:opacity .2s}
#combo.on #cWrap{opacity:1}
#combo b{font-size:calc(34.7px*var(--t));color:var(--amber);text-shadow:3px 3px 0 var(--ink);display:inline-block}
#combo span{font-size:calc(11.2px*var(--t));letter-spacing:.12em;margin-left:calc(4px*var(--t));text-shadow:2px 2px 0 var(--ink)}
#combo.pop b{animation:pop .18s steps(3)}
#combo em{display:block;font-style:normal;font-size:calc(10.2px*var(--t));color:var(--paper);opacity:.85;margin-top:calc(4px*var(--t));letter-spacing:.06em;text-shadow:2px 2px 0 var(--ink)}
#flow{display:flex;align-items:center;gap:calc(4px*var(--t));margin-top:calc(6px*var(--t));padding-bottom:calc(7px*var(--t));position:relative;width:max-content;font-size:calc(9.2px*var(--t));letter-spacing:.12em;text-shadow:2px 2px 0 var(--ink);opacity:0;transition:opacity .3s}
#flow.on{opacity:1}
/* ÍMPETO: barra contínua sob as 3 marcas de FLUXO, com divisões nos limiares de nível (25/55/85) */
#imp{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(239,230,210,.2);box-shadow:0 1px 0 var(--ink)}
#imp::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(25% - 1px),var(--ink) calc(25% - 1px) 25%,transparent 25% calc(55% - 1px),var(--ink) calc(55% - 1px) 55%,transparent 55% calc(85% - 1px),var(--ink) calc(85% - 1px) 85%,transparent 85%)}
#impF{height:100%;width:0;background:var(--steel);transition:width .12s linear}
#flow.max #impF{background:var(--amber)}
#flow i{width:calc(10px*var(--t));height:calc(6px*var(--t));border:2px solid var(--paper);display:inline-block}
#flow i.on{background:var(--steel);border-color:var(--steel)}
#flow.max i.on{background:var(--amber);border-color:var(--amber)}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
/* letreiro (round, nocaute) numa faixa logo abaixo do HUD, que a câmera reserva enquanto ele aparece: não cobre os lutadores;
   no retrato fica abaixo do contador de combo (CAME-8) */
#banner{position:absolute;left:0;right:0;top:calc(64px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;font-family:var(--display);opacity:0;transition:opacity .25s}
#banner.on{opacity:1}
@media (orientation:portrait){#banner{top:calc(136px + env(safe-area-inset-top,0px))}}
/* modo cinema (cena de contra e ESPECIAL, quando a entrada já está travada): botões e HUD esmaecem (CAME-4) */
#hud,#combo,#pad,#stickHint{transition:opacity .2s}
.cine #pad,.cine #stickHint{opacity:.15}
.cine #hud,.cine #combo,.cine .exit{opacity:0;transition:opacity .2s}
#banner h2{margin:0;font-size:clamp(28px,8vw,calc(56px*var(--t)));color:var(--paper);text-shadow:calc(4px*var(--t)) calc(4px*var(--t)) 0 var(--blood),calc(8px*var(--t)) calc(8px*var(--t)) 0 var(--ink);letter-spacing:.06em}
#banner p{margin:calc(8px*var(--t)) auto 0;font-family:var(--body);font-size:calc(13.3px*var(--t));max-width:40ch;text-shadow:2px 2px 0 var(--ink);padding:0 calc(16px*var(--t))}
#stick{position:absolute;width:calc(110px*var(--u));height:calc(110px*var(--u));margin:calc(-55px*var(--u)) 0 0 calc(-55px*var(--u));border:2px solid var(--glass);border-radius:50%;background:rgba(13,11,18,.25);pointer-events:none;opacity:0;transition:opacity .15s}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:calc(46px*var(--u));height:calc(46px*var(--u));margin:calc(-23px*var(--u)) 0 0 calc(-23px*var(--u));border-radius:50%;background:rgba(239,230,210,.35);border:2px solid var(--paper)}
#stickHint{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:96px;height:96px;transform:scale(var(--u));transform-origin:0 100%;border-radius:50%;
  border:2px dashed rgba(239,230,210,.22);pointer-events:none;display:grid;place-items:center;font-family:var(--display);font-size:9.2px;opacity:.6;text-align:center}
#pad{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:244px;height:256px;transform:scale(var(--u));transform-origin:100% 100%}
#pad button{position:absolute;border-radius:50%;border:3px solid var(--paper);color:var(--paper);font-family:var(--display);font-size:8.2px;line-height:1.05;letter-spacing:.03em;
  background:rgba(13,11,18,.5);touch-action:none;padding:0 4px;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;text-align:center}
#pad button:active,#pad button.dn{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#bAtk{width:92px;height:92px;right:4px;bottom:8px;background:rgba(16,34,112,.88)!important;border-color:#8fa8ff!important;font-size:12.2px!important}
#b1,#b2,#b3{width:60px;height:60px;background:rgba(127,214,255,.18)!important;border-color:rgba(239,230,210,.85)!important}
#b1{right:104px;bottom:4px}#b2{right:110px;bottom:70px}#b3{right:56px;bottom:104px}
#bCnt{width:56px;height:56px;right:0;bottom:110px;background:rgba(255,255,255,.82)!important;color:#15121c!important;border-color:#fff}
#bDef{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:0}
#bDef small{display:block;font-size:7.1px;line-height:1;letter-spacing:0;margin-top:1px;opacity:1;color:#e9fff1}
#bDef{width:70px;height:70px;font-size:9.2px!important;right:0;bottom:176px;background:rgba(60,110,86,.78)!important;color:#fff;border-color:#bfe8cf}
#bDef.dn,#bDef.on{background:rgba(90,170,126,.95)!important}
#bDod{width:56px;height:56px;right:176px;bottom:6px;background:rgba(220,40,40,.78)!important;color:#fff;border-color:#ffd0d0}
#bTh{width:60px;height:60px;right:122px;bottom:134px;font-size:6.6px!important;background:rgba(242,169,59,.28)!important;border-color:#f2a93b!important}
#bFin{width:56px;height:56px;right:180px;bottom:72px;opacity:.4}
#bFin.chg{opacity:.85;background:rgba(242,169,59,.3)!important}
#bFin.ready{opacity:1;background:rgba(242,169,59,.75)!important;animation:pulse .5s steps(2) infinite}
#bFin.super{background:rgba(127,214,255,.75)!important}
#bTrc{width:56px;height:56px;right:186px;bottom:136px;font-size:6.6px!important;background:rgba(150,60,210,.82)!important;border-color:#e8c4ff!important;color:#fff}
#bTrc.cd{opacity:.35}
#pad button.trcgo{border-color:#fff!important;box-shadow:0 0 0 5px #d98cff,0 0 26px 10px rgba(217,140,255,.9)!important;animation:pulse .22s steps(2) infinite;z-index:3}
/* TROCAÇÃO: painel do botão pedido (fica abaixo do HUD; a câmera da troca já deixa a faixa livre) */
#trc{position:absolute;left:0;right:0;top:calc(46px*var(--t) + 48px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;font-family:var(--display);z-index:4}
#trcH{font-size:calc(10.2px*var(--t));letter-spacing:.2em;color:#d98cff;text-shadow:2px 2px 0 var(--ink)}
#trcP{display:flex;gap:4px;justify-content:center;margin:4px 0}
#trcP i{width:calc(14px*var(--t));height:calc(6px*var(--t));border:2px solid #d98cff;display:inline-block}
#trcP i.ok{background:#7fd6ff;border-color:#7fd6ff}#trcP i.bad{background:#d8402f;border-color:#d8402f}#trcP i.cur{background:#d98cff;animation:pulse .3s steps(2) infinite}
#trcK{font-size:clamp(26px,7vw,calc(48px*var(--t)));letter-spacing:.06em;line-height:1;text-shadow:3px 3px 0 var(--ink),0 0 18px currentColor;animation:pulse .2s steps(2) infinite}
#trcB{width:calc(200px*var(--t));max-width:70vw;height:calc(8px*var(--t));margin:calc(6px*var(--t)) auto 0;border:2px solid var(--paper);background:var(--ink);overflow:hidden}
#trcB i{display:block;height:100%;width:100%;background:#d98cff}
@media (prefers-reduced-motion:reduce){#trcK,#trcP i.cur,#pad button.trcgo{animation:none}}
#bCnt.nocnt{opacity:.3}
#bDod.alert.red,#bDod.red{background:rgba(255,40,40,.92)!important;color:#fff;border-color:#fff}
#bCnt.alert{background:rgba(255,255,255,.95)!important;color:var(--ink);animation:pulse .18s steps(2) infinite}
/* finta: o botão fica branco e parado (não é hora de CONTRA); tropeço da finta: a ESQUIVA pulsa (INTE-14) */
#bCnt.feint{background:rgba(239,230,210,.5)!important;border-color:#fff;color:var(--ink)}
#bDod.alert{background:rgba(127,214,255,.8)!important;color:var(--ink);animation:pulse .18s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#pad button:focus-visible,.card:focus-visible,.cta:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(20px*var(--m));
  background:linear-gradient(180deg,rgba(13,11,18,.55),rgba(13,11,18,.92));
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  overflow-y:auto;text-align:center}
.screen h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,calc(64px*var(--m)));line-height:.95;letter-spacing:.04em;text-shadow:calc(4px*var(--m)) calc(4px*var(--m)) 0 var(--blood),calc(8px*var(--m)) calc(8px*var(--m)) 0 #000;text-wrap:balance}
.screen .sub{margin:0;font-size:calc(14.3px*var(--m));opacity:.85;max-width:44ch}
.cards{display:flex;gap:calc(26px*var(--m));flex-wrap:wrap;justify-content:center}
.card{width:calc(150px*var(--m));background:rgba(239,230,210,.06);border:3px solid rgba(239,230,210,.35);color:var(--paper);font-family:var(--body);padding:calc(8px*var(--m)) calc(8px*var(--m)) calc(10px*var(--m));cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:calc(4px*var(--m))}
 #pickT{margin:calc(4px*var(--m)) 0 0;font-family:var(--display);font-size:calc(22.4px*var(--m));letter-spacing:.08em;text-align:center;padding:calc(7px*var(--m)) calc(22px*var(--m));border:3px solid currentColor;background:rgba(0,0,0,.55);animation:pkPulse 1.1s ease-in-out infinite}
#pickT.pk0{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.9),3px 3px 0 #000;box-shadow:0 0 18px rgba(255,255,255,.55),inset 0 0 12px rgba(255,255,255,.2)}
#pickT.pk1{color:#4da3ff;text-shadow:0 0 12px rgba(77,163,255,.95),3px 3px 0 #000;box-shadow:0 0 18px rgba(77,163,255,.65),inset 0 0 12px rgba(77,163,255,.25)}
@keyframes pkPulse{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){#pickT{animation:none}}
@media (max-height:420px){#pickT{font-size:15.3px;padding:4px 14px}}
.card.selP{border-color:#ffffff;box-shadow:0 0 0 2px #fff,0 0 22px 4px rgba(255,255,255,.75);background:rgba(255,255,255,.1)}
.card.selE{border-color:#4da3ff;box-shadow:0 0 0 2px #4da3ff,0 0 24px 5px rgba(77,163,255,.85);background:rgba(77,163,255,.12)}
.card.selP.selE{box-shadow:0 0 0 2px #fff,0 0 0 6px #4da3ff,0 0 26px 6px rgba(77,163,255,.8)}
.card.trn{border-color:#f2a93b;background:rgba(242,169,59,.14);box-shadow:0 0 0 2px #f2a93b,0 0 20px 3px rgba(242,169,59,.6);animation:trnGlow 1.6s ease-in-out infinite}
@keyframes trnGlow{50%{box-shadow:0 0 0 2px #ffd27a,0 0 30px 8px rgba(242,169,59,.85)}}
@media (prefers-reduced-motion:reduce){.card.trn{animation:none}}
@media (orientation:portrait){.card.trn{order:-1;width:calc(312px*var(--m));flex-direction:row;align-items:center;text-align:left;gap:calc(10px*var(--m))}.card.trn canvas{width:calc(78px*var(--m));height:calc(78px*var(--m));flex:none}}
.card.trn .tt{display:flex;flex-direction:column;align-items:center;gap:calc(4px*var(--m))}
.card.trn strong{color:#f2a93b}
@media (orientation:portrait){.card.trn .tt{align-items:flex-start}}.card.trn.selT{background:rgba(242,169,59,.3);box-shadow:0 0 0 2px #fff,0 0 26px 6px rgba(242,169,59,.9)}
.card:hover,.card:active{border-color:var(--amber);background:rgba(242,169,59,.12)}
.card canvas{width:calc(120px*var(--m));height:calc(120px*var(--m));image-rendering:pixelated}
.card strong{font-family:var(--display);font-size:calc(13.3px*var(--m));letter-spacing:.06em}
.card small{font-size:calc(11.2px*var(--m));opacity:.8;line-height:1.3}
.how{font-size:calc(12.2px*var(--m));opacity:.78;max-width:60ch;line-height:1.5;margin:0}
.how b{color:var(--amber);font-weight:600}
.ctas{display:flex;gap:calc(12px*var(--m));flex-wrap:wrap;justify-content:center}
.cta.alt{background:rgba(13,11,18,.6)}
.cta:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.cta{font-family:var(--display);font-size:calc(14.3px*var(--m));padding:calc(12px*var(--m)) calc(22px*var(--m));background:var(--blood);color:var(--paper);border:3px solid var(--paper);box-shadow:0 calc(4px*var(--m)) 0 #000;cursor:pointer}
@media (prefers-reduced-motion:reduce){#bFin.ready,#bCnt.alert,#bDod.alert,#combo.pop b{animation:none}}
@media (max-height:420px){.card canvas{width:64px;height:64px}.card small{font-size:9.2px;line-height:1.2}.card{padding:4px 6px 6px}.screen h1{font-size:24.5px;line-height:1.05}.screen{gap:17px}.difd{margin:0;min-height:0}.difd:empty{display:none}.cards{gap:26px}.difs{gap:20px}#menu .card canvas{width:44px;height:44px}.dif{min-height:38px}}

.exit{position:absolute;left:50%;transform:translateX(-50%);top:calc(46px*var(--t) + env(safe-area-inset-top,0px));z-index:5;font-family:var(--display);font-size:calc(9.2px*var(--t));letter-spacing:.1em;padding:calc(5px*var(--t)) calc(12px*var(--t));min-height:44px;min-width:44px;background:rgba(13,11,18,.55);color:var(--paper);border:2px solid rgba(239,230,210,.7);cursor:pointer;opacity:.85}

.exit:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.screen.pz{background:rgba(13,11,18,.78)}
.cine .exit{pointer-events:none}
.difs{display:flex;gap:calc(20px*var(--m));justify-content:center;flex-wrap:wrap}
.dif{font-family:var(--display);font-size:calc(11.2px*var(--m));letter-spacing:.08em;padding:calc(8px*var(--m)) calc(14px*var(--m));min-height:44px;background:rgba(13,11,18,.55);color:var(--paper);border:2px solid rgba(239,230,210,.45);cursor:pointer}

@media (hover:hover) and (pointer:fine){.kbd{display:block}}

/* o cenário sorteado aparece por trás: véu escuro leve, cards e textos com fundo/sombra própria para ler em qualquer cenário (claro ou escuro) */
#menu{background:linear-gradient(180deg,rgba(13,11,18,.34),rgba(13,11,18,.72))}
#menu .card{background:rgba(13,11,18,.74)}
#menu .card.selP{background:rgba(40,40,52,.85)}
#menu .card.selE{background:rgba(14,40,84,.85)}

#menu .card small,#menu .difd{text-shadow:0 1px 0 #000,0 0 6px #000;opacity:1}
#menu .card strong{text-shadow:0 2px 0 #000}
#menu .dif{background:rgba(13,11,18,.78)}#menu .dif.on{background:var(--blood)}
#menu h1{text-shadow:calc(4px*var(--m)) calc(4px*var(--m)) 0 var(--blood),calc(8px*var(--m)) calc(8px*var(--m)) 0 #000,0 0 18px rgba(0,0,0,.6)}
#scenes{background:rgba(10,8,14,.97)}
/* botão do menu que abre a escolha de cenários e a tela com todos os cenários (+ cartão ALEATÓRIO) */
.scbtn{display:flex;align-items:center;gap:calc(10px*var(--m));font-family:var(--display);font-size:calc(11.2px*var(--m));letter-spacing:.08em;color:var(--paper);background:rgba(13,11,18,.82);border:3px solid var(--amber);padding:calc(8px*var(--m)) calc(16px*var(--m));cursor:pointer;box-shadow:0 0 14px rgba(242,169,59,.45)}
.scbtn b{color:var(--amber);font-weight:700}
.scwarn{margin:0;font-family:var(--display);font-size:calc(10.2px*var(--m));letter-spacing:.08em;color:#fff;background:#c0392b;border:2px solid #fff;padding:calc(5px*var(--m)) calc(12px*var(--m))}

<script>
(()=>{
'use strict';
// multiplicador de vida dos dois lutadores: partidas mais longas (o dano por golpe não muda, o equilíbrio fica igual)
const HPX=4.5;
const TAU=Math.PI*2,PI=Math.PI,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, eout=t=>1-Math.pow(1-t,3);
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=320,H=200,HOR=65,PORT=false;

let paused=false,UI_U=1;
// escala da interface: --t (texto, HUD, menus) cresce com a tela; --u (botões de toque e direcional) cresce menos e encolhe em telas pequenas
function setScale(){const m=Math.min(innerWidth,innerHeight),coarse=matchMedia('(pointer:coarse)').matches;
  UI_U=coarse?clamp(m/390,.8,1.5):clamp(m/520,.85,1.25);const t=clamp(m/390,.85,2.2),r=document.documentElement.style;r.setProperty('--u',UI_U.toFixed(3));r.setProperty('--t',t.toFixed(3));r.setProperty('--m',clamp(Math.min(innerHeight/560,innerWidth/420),.8,2).toFixed(3));}
function resize(){setScale();const a=innerWidth/Math.max(1,innerHeight);PORT=a<1;if(a>=1){H=200;W=Math.round(200*a);}else{W=240;H=Math.round(240/a);}cv.width=W;cv.height=H;HOR=H-135;computeSafe();camReset=true;}
// câmera 3D (VISU-6/CAME-9): lateral (camX), altura (camY), avanço/dolly (camZ) e órbita em torno do centro da arena (camYaw).
// O zoom 2D que vem depois só faz o papel de FOV em volta do foco; a paralaxe real vem daqui
let camX=0,camY=80,camZ=0,camYaw=0,cyS=0,cyC=1;
const P=(x,y,z)=>{let dx=x-camX,dz=z-PIV;if(cyS){const t=dx*cyC-dz*cyS;dz=dx*cyS+dz*cyC;dx=t;}const s=F/Math.max(NEAR,dz+PIV-camZ);return [W/2+dx*s,HOR+(camY-y)*s,s];};
// espaço da câmera (x, y, profundidade) para recortar no plano próximo o que o dolly/órbita põe atrás da lente
function cs3(x,y,z){let dx=x-camX,dz=z-PIV;if(cyS){const t=dx*cyC-dz*cyS;dz=dx*cyS+dz*cyC;dx=t;}return [dx,y,dz+PIV-camZ];}
const pj=c=>{const s=F/c[2];return [W/2+c[0]*s,HOR+(camY-c[1])*s];};

// ---------- paletas ----------
const PAL={
  boxP:{skin:'#c98a5e',skinD:'#87522f',skinH:'#e8b183',hair:'#1b1310',hairH:'#3d2c23',sh:'#b3202a',shD:'#6e1118',trim:'#f2e6c8',trimD:'#a3957a',gl:'#d82c2c',glD:'#7a1016',glH:'#ff8a7a',boot:'#1c1a20',bootD:'#0f0e12',bootH:'#3b3843',sole:'#d9cfbd',trail:'#ff6a4d'},

  tkdP:{skin:'#e8be90',skinD:'#9b7452',skinH:'#ffe0bb',hair:'#141414',hairH:'#3c3c40',gi:'#f0efe9',giD:'#a9a8b6',giH:'#ffffff',lap:'#6c6b78',belt:'#151515',band:'#c62828',trail:'#7fd6ff'},
  tkdE:{skin:'#d9a477',skinD:'#8c6141',skinH:'#f3c79f',hair:'#2a1d16',hairH:'#54402f',gi:'#2c2c34',giD:'#141418',giH:'#4a4a58',lap:'#62627a',belt:'#c62828',band:null,trail:'#c43d3d'},
};
// CORES DOS UNIFORMES (todo o jogo usa as mesmas cinco): preta, azul, verde, vermelha e branca. O menu mostra tudo em preto; ao começar
// a luta cada lutador recebe uma cor sorteada, e dois lutadores do MESMO estilo nunca ficam com a mesma cor (colorsFor).
const COLS=[
 {n:'preta',main:'#26262d',dark:'#101014',light:'#52525e',acc:'#c9a24a'},
 {n:'azul',main:'#2456b8',dark:'#12306e',light:'#6a95ea',acc:'#e8e8ee'},
 {n:'verde',main:'#1f8a44',dark:'#0e4d25',light:'#5cc982',acc:'#f0e6b0'},
 {n:'vermelha',main:'#c62a32',dark:'#6e1218',light:'#f2766f',acc:'#f2e6c8'},
 {n:'branca',main:'#efeee8',dark:'#a8a7b4',light:'#ffffff',acc:'#c62a32'}];
function palFor(style,ci,isP){
  const b=PAL[style+(isP?'P':'E')],C=COLS[ci],o=Object.assign({},b);
  if(style==='tkd'||style==='cap'){Object.assign(o,{gi:C.main,giD:C.dark,giH:C.light,lap:mixHex(C.main,C.dark,.55),belt:C.acc,band:isP?C.acc:null,trail:C.light});}

  return o;}
function colorsFor(style,es){const a=Math.floor(Math.random()*5);let b=Math.floor(Math.random()*5);if(style===es)while(b===a)b=Math.floor(Math.random()*5);return [a,b];}
const WOODPAL={skin:'#b4864f',skinD:'#7b5630',skinH:'#d9b27a',hair:'#8a6238',hairH:'#a6784a',sh:'#9a7040',shD:'#5e4122',trim:'#c9a46a',trimD:'#8a6c3c',gl:'#a8793f',glD:'#6b4a26',glH:'#d9b27a',boot:'#7b5630',bootD:'#5e4122',bootH:'#a8793f',sole:'#c9a46a',trail:'#d9b27a'};
const NAMES={box:'Henrique',tkd:'Minjun'};

// ---------- poses: [inclinação, cabeça, ombroF, cotoveloF, ombroT, cotoveloT, quadrilF, joelhoF, quadrilT, joelhoT] ----------
// ginga da capoeira: lado A (perna direita na frente, braço esquerdo guardando o rosto) e lado B (espelho), e um floreio de perna
const GA=[.6,-.25,1.7,1.5,-1.1,.4,1.05,-1.4,-.6,-.1],GB=[.25,-.05,-1.0,.4,1.5,2.2,-.55,-.1,1.1,-1.5],GFLR=[.15,-.1,1.7,1.5,-.9,.5,.4,-.2,1.7,-1.9],GWID=[.2,-.1,2.2,.3,2.2,.3,.9,-.9,-.8,-.2];
const G={box:[.2,-.15,.95,2.05,.55,2.4,.3,-.4,-.35,-.3],tkd:[-.05,.05,.55,1.3,.25,1.6,.35,-.25,-.5,-.15]};
const HURT_HEAD=[-.55,.65,-.2,.8,-.5,.6,.45,-.5,-.3,-.2];
const HURT_BODY=[.75,-.25,.6,2.3,.4,2.5,.5,-.95,-.3,-.65];
const STAG=[-.1,.45,.25,.5,.05,.4,.45,-1.0,-.3,-.75];
const AIRP=[-.7,.6,-.9,.4,-1.1,.3,.7,-.6,-.2,-.5],AIRP2=[.4,.5,-.6,1.2,-.8,1.0,1.4,-2.0,.9,-1.8];
// levantada: sentado com um joelho no chão (FLUI-12)
const KNEEL=[.9,.2,1.2,2.2,.8,2.3,1.5,-2.3,-.2,-1.7];

  const a=f.isP?T0:T1,u=el-a,b=Math.abs(Math.sin(el*8)),gd=G[f.style].slice();
  const guard=(k)=>{f._si=null;f.spin=lerp(f.spin,0,.3);f.tw=lerp(f.tw,0,.2);
    if(box||f.style==='mt'){gd[0]+=.14;gd[1]-=.12;gd[7]-=.14+b*.14;gd[9]-=.1+b*.1;gd[2]+=Math.sin(el*9)*.1;}else{gd[7]-=.05+b*.3;gd[9]-=.05+b*.25;gd[6]+=b*.1;}
    setPose(f,gd,k||260,.7);};
  if(el<a||el>=a+TW||el>=T2){guard();return;}
  if(f.style==='mt'){
    // WAI KHRU: mãos em prece, reverência profunda ao oponente, e o RAM MUAY: braços abertos e joelho levantado, pose do tigre
    f._si=null;f.spin=0;f.tw=0;const PRAY=[.12,.1,1.0,2.1,.95,2.15,.4,-.35,-.35,-.2],BOW=[1.0,.55,1.0,2.1,.95,2.15,.4,-.35,-.35,-.2],TIG=[-.1,-.2,2.05,1.1,1.0,1.0,1.55,-1.85,-.45,-.25],OPEN=[.05,-.1,1.75,.5,1.8,.5,.4,-.4,-.4,-.25];
    const k1=clamp(u/.35,0,1),k2=clamp((u-.35)/.5,0,1)-clamp((u-.95)/.3,0,1),k3=clamp((u-1.15)/.3,0,1);
    const o=lerpPose(lerpPose(G.mt,PRAY,ease(k1)),BOW,ease(Math.max(0,k2)));
    setPose(f,k3>0?lerpPose(lerpPose(o,OPEN,ease(k3)),TIG,ease(clamp((u-1.3)/.3,0,1))):o,380,.7);return;}
  if(f.style==='cap'){
    // RODA: ginga baixa, aú (estrela) e saudação ao pé do berimbau, com a mão no ar
    f._si=null;f.spin=0;f.tw=0;const sw=Math.sin(u*9);
    if(u<.55){f.rot=0;setPose(f,pz(G.cap,{0:.3+sw*.07,2:1.25+sw*.35,3:2.2-sw*.25,4:.3-sw*.4,6:.55+sw*.35,7:-.75-Math.abs(sw)*.25,8:-.35-sw*.3,9:-.02-Math.max(0,-sw)*.3}),300,.7);}
    else if(u<1.2){const k=clamp((u-.55)/.65,0,1);f.rot=ease(k)*TAU;setPose(f,k<.2?[.9,0,2.9,.1,2.8,.1,1.0,-.6,-.2,-.1]:[.5,0,3.05,0,3.05,0,1.15,-.1,-1.2,-.05],500,.65);}
    else{f.rot=0;setPose(f,[.1,-.1,2.8,.3,1.2,1.9,.5,-.5,-.45,-.05],420,.7);}
    return;}
  if(box){
    const seq=['jab','jab','dir','gan','upp','ovr'],L=seq.map(k=>MOV.box[k].d*.72);let w=u,i=0;
    while(i<5&&w>=L[i]){w-=L[i];i++;}
    if(u>=L.reduce((x,y)=>x+y,0)){guard();return;}
    const mv=MOV.box[seq[i]];sampleMv(f,mv,Math.min(w/.72,mv.d));
    f.tw=Math.max(f.tw,.25);f.pt[7]-=Math.abs(Math.sin(el*11))*.25;f.pt[9]-=Math.abs(Math.sin(el*11+1))*.2;
  }else{
    f._si=null;f.spin=0;f.tw=0;

    const salute=[-.02+br,-.2,1.2,2.1,1.2,2.2,.3,-.2,-.4,-.1],stand=[br,-.1,.2,.4,.2,.4,.15,-.15,-.15,-.1],down=[1.05,.55,.2,.35,.2,.35,.1,-.1,-.1,-.1];

function dust(x,z,n,sp){for(let i=0;i<n;i++)parts.push({x:x+rnd(-6,6),y:1,z:z+rnd(-3,3),vx:rnd(-1,1)*(sp||40),vy:rnd(5,25),vz:rnd(-10,10),l:rnd(.3,.6),ml:.6,c:'#8d8478',t:'d'});}
function ring(x,z,r,c){parts.push({x,y:0,z,l:.4,ml:.4,t:'r',r,c:c||'#f2a93b',vx:0,vy:0,vz:0});}
// textos que nascem juntos no mesmo lutador (PERFEITO + FLUXO 2!, PELAS COSTAS + RUPTURA) empilham em vez de se sobrepor
function pop(txt,f,c){let n=0;for(const q of pops)if(q.o===f&&q.l>.72)n++;pops.push({txt,o:f,x:f.x,y:f.y+66+n*8,z:f.z,l:.9,c:c||'#efe6d2'});}
function setPose(f,p,k,zt){const s=p||G[f.style];for(let i=0;i<10;i++)f.pt[i]=s[i];f.k=k||160;f.zt=zt||.75;}
function kick(f,i,v){f.pv[i]+=v;}
const wrapA=a=>((a+PI)%TAU+TAU)%TAU-PI;
// virada contínua: o lado visível (cos(spin+turn)·face) não salta, mesmo no meio de outra virada ou de um giro
function setFace(f,nf){if(nf&&nf!==f.face){unspin(f);f.face=nf;f.turn=wrapA(f.turn+PI);}}
// passa o resíduo do giro (spin) para turn, que o phys desfaz suavemente; o desenho continua idêntico no quadro da troca
function unspin(f){if(f.spin){f.turn=wrapA(f.spin+f.turn);f.spin=0;f.tv=0;}}
// passa o resíduo do mortal (rot) para rotR, que termina a volta no mesmo sentido (rotDir) em vez de estalar para 0
function unrot(f){
  if(!f.rot)return;const v=f.rot+f.rotR,d=f.rotDir||0;let r=((v%TAU)+TAU)%TAU;
  if(d<0){if(r>TAU-.6)r-=TAU;}else if(d>0){r-=TAU;if(r<.6-TAU)r+=TAU;}else if(r>PI)r-=TAU;
  f.rotR=r;f.rot=0;f.rotDir=0;
}
// giro do chute (FLUI-13): contra-giro curto de preparação (até mv.a), depois acelera até o impacto (g sobe com velocidade
// final ve, a perna sai no pico do giro e não com o corpo parado), segura o corpo um instante e termina na volta inteira
// seguinte (de frente, nunca numa volta extra nem de costas) com um sobrepasso que volta. ret: volta a 0 em vez de completar
const g3=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
function spinAt(mv,t){
  if(!mv.spin)return 0;const s0=mv.spin*mv.sa,a=mv.a,h=mv.h0;
  if(mv.ret){
    if(t<a)return 0;
    if(t<h){const u=(t-a)/Math.max(.01,h-a),ve=mv.ve===undefined?1.4:mv.ve;return s0*(u*u*((3-ve)+(ve-2)*u));}
    return s0*(1-g3((t-h)/Math.max(.01,mv.d-h)));
  }
  const wa=mv.wa===undefined?.3:mv.wa,end=Math.ceil(s0/TAU-1e-6)*TAU;
  if(t<a)return -wa*g3(t/Math.max(.01,a));
  if(t<h){const u=(t-a)/Math.max(.01,h-a),ve=mv.ve===undefined?1.5:mv.ve;return -wa+(s0+wa)*(u*u*((3-ve)+(ve-2)*u));}
  const u=clamp((t-h)/Math.max(.01,mv.d-h),0,1),hd=mv.hd===undefined?.2:mv.hd,ov=mv.ov===undefined?(end-s0<.05?.35:.12):mv.ov;
  return s0+(end-s0)*g3((u-hd)/(1-hd))+ov*Math.sin(PI*Math.pow(u,.6));
}
// golpe com mortal/estrela/bananeira (mv.rot): o corpo gira em volta do quadril; rret = sobe até a metade e volta (bananeira)
function rotAt(mv,t){if(!mv.rot)return 0;const u=clamp(t/(mv.d*(mv.rr||.85)),0,1);return mv.rret?mv.rot*Math.min(1,Math.sin(PI*u)*1.7):mv.rot*ease(u);}
const lerpPose=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
// IK de 2 ossos da perna (coxa e canela de 13): ângulos de quadril e joelho que põem o tornozelo em (fx,fy) a partir do quadril
const LEG=14.5,HS=.8;
function ik2(fx,fy){const d=Math.min(2*LEG-.1,Math.hypot(fx,fy)),a=Math.atan2(fx,-fy);return [a+Math.acos(clamp(d/(2*LEG),-1,1)),-(PI-Math.acos(clamp(1-d*d/(2*LEG*LEG),-1,1)))];}
// tornozelos na guarda (descanso de cada pé) e passada de cada estilo: o boxeador arrasta sem cruzar os pés (FLUI-6)
const FK=(o,i)=>{const a=o[6+2*i],b=a+o[7+2*i];return [LEG*Math.sin(a)+LEG*Math.sin(b),-LEG*Math.cos(a)-LEG*Math.cos(b)];};
// passo de luta (step-drag): o pé da frente sai, o de trás vem logo atrás e os dois ficam plantados o resto do ciclo, sem
// cruzar; para trás a ordem inverte sozinha (o pé de trás sai primeiro). f/b = tornozelo base de cada pé (um pouco mais baixo
// que a guarda, para todo passo caber na perna), c = ciclo em unidades andadas, a = fração do ciclo em balanço, L = altura
const WK={box:{f:3.3,b:-10.9,y:-26.2,c:14,a:.25,L:3.3},tkd:{f:5,b:-11.7,y:-25.1,c:16,a:.3,L:5}},STR={box:14,tkd:16};
// caminhada por IK: o pé de apoio recua exatamente o que o corpo avança (a fase vem da distância percorrida), o outro passa
// por cima em arco; f.gx = fração do movimento no eixo x (andando em profundidade o passo é no lugar, sem deslizar);
// o ponto mais baixo do pé (calcanhar ou ponta) fica no chão: o pé que fica atrás apoia na ponta
function walkPose(f,base,m){const o=base.slice(),K=WK[f.style],T=(f.str||K.c)*(1-K.a)*f.gx,A=K.a*TAU,L=K.L*Math.min(1,.4+m);
  for(let i=0;i<2;i++){const ps=((f.walk-(i?A:0))%TAU+TAU)%TAU,x0=i?K.b:K.f;let x,y=K.y;
    if(ps<A){const v=ps/A;x=x0-T/2+T*ease(v);y+=L*Math.sin(PI*v);}else x=x0+T/2-T*(ps-A)/(TAU-A);
    let r=ik2(x,y);for(let k=0;k<2;k++){const dp=-4.5*Math.sin(r[0]+r[1]);if(dp<=.05)break;r=ik2(x,y+dp);}o[6+2*i]=r[0];o[7+2*i]=r[1];}
  const s=Math.sin(f.walk);o[2]-=s*.07;o[4]+=s*.07;o[0]+=Math.abs(Math.cos(f.walk))*.035;
  if(f.style==='cap'){const w=f.walk*.5,cw=Math.cos(w),A=lerpPose(GA,GB,(1+Math.sin(w))/2);
    // dança o tempo todo enquanto anda: braços e tronco seguem a ginga (A↔B) em ondas largas, cabeça e ombros balançam
    o[0]=A[0]+cw*.25+.1;o[1]=A[1]-cw*.15;o[2]=A[2]+Math.sin(w*2)*.3;o[3]=A[3]+Math.sin(w*2)*.3;o[4]=A[4]+Math.cos(w*2)*.3;o[5]=A[5]+Math.cos(w*2)*.3;
    const cy=time/2.4+f.bob*.3,ph=cy%1,ix=Math.floor(cy)%5,env=Math.sin(PI*clamp((ph-.12)/.76,0,1));
    if(ix<4){const I=IMPR[ix];for(let i=0;i<6;i++)o[i]=lerp(o[i],I[i],env*.6);}}
  return o;}
// avança a fase da passada pelo deslocamento real (para trás a fase recua: nada de moonwalk)
function stepWalk(f,dx,dz,dt){const d=Math.hypot(dx,dz);if(d<1e-5)return;const dl=dx*f.face;
  f.gx=lerp(f.gx,Math.abs(dl)/d,1-Math.exp(-dt*12));f.walk+=(dl<-.2*d?-d:d)*TAU/(f.str||STR[f.style]);}
// locomoção por velocidade com aceleração; o peso da passada (gw) segue a velocidade real (FLUI-10)
function loco(f,vx,vz,sp,acc,dt){const a=1-Math.exp(-dt*acc);f.lvx=lerp(f.lvx,vx,a);f.lvz=lerp(f.lvz,vz,a);
  const nx=clamp(f.x+f.lvx*dt,-AX,AX),nz=clamp(f.z+f.lvz*dt,Z0,Z1);stepWalk(f,nx-f.x,nz-f.z,dt);f.x=nx;f.z=nz;

// alcance real do golpe no quadro do impacto (membro, giro, torção, pé de apoio) → espaçamento do dash e do magnetismo:
// a luva/o pé encosta na superfície do rival em vez de parar no ar ou atravessar o corpo (FLUI-1)

function impF(mv,st){const h=mv.hits[0];let ki=0;for(let i=0;i<mv.keys.length;i++)if(h.t>=mv.keys[i][0])ki=i;
  return {style:st,pose:(mv.keys[ki][1]||G[st]).slice(),tw:mv.tw,twS:mv.twS,spin:spinAt(mv,h.t),turn:0,rot:rotAt(mv,h.t),rotR:0,y:0,ro:0,gw:0,st:'atk',mv,face:1};}

// pé de apoio do golpe: no chute, a perna que não chuta; no soco, o pé da frente (o pivô do check hook) (FLUI-9)

function dashTo(p,kind,o){

// a região atingida recebe o impulso nas molas da pose: cabeça estala, peito vai para trás, barriga dobra, costas arqueiam, braço balança, perna cede
function reactArea(d,ar,hv){const m=hv?1.5:1;
  switch(ar){
    case 'head':kick(d,0,-8*m);kick(d,1,15*m);d.fl=.5;break;
    case 'chest':kick(d,0,-10*m);kick(d,1,5*m);kick(d,2,-6*m);kick(d,4,6*m);d.fl=.2;break;
    case 'belly':kick(d,0,12*m);kick(d,1,14*m);kick(d,7,-8*m);kick(d,9,-7*m);kick(d,2,6*m);kick(d,3,-4*m);d.fl=.35;break;

    case 'arm':kick(d,2,-10*m);kick(d,3,8*m);kick(d,4,5*m);kick(d,0,-3*m);break;
    case 'leg':kick(d,7,-14*m);kick(d,9,-12*m);kick(d,6,6*m);kick(d,0,5*m);d.vx*=.5;break;
  }

// ---------- jogador ----------
function updPlayer(p,rdt){
  const lt=(p.st==='atk'||p.st==='dash')?(1+p.flow*.12)*(STY[p.style].spd||1):1;const dt=rdt*lt;
  p.t+=dt;
  const a=inp.act,e=enemy;

  // fora do if de running/roundOver para nada vazar para o round seguinte (INTE-4/INTE-9)
  if(a){if(time-a.g>.3||performance.now()-a.t>1500)inp.act=null;else if(running&&!roundOver&&tryAct(p,a.k))inp.act=null;}

  if(p.finBuf){const fb=p.finBuf;if(isDown(e)||e.st==='air')fb.d=Math.max(fb.d,time+.5);
    if(!live||time>fb.d||time-fb.g>4)p.finBuf=null;else if(canFin(p)){p.finBuf=null;p.hold=null;doFinisher(p);}}

  if(p.hold){if(!live||time-p.hold.g>2.6||!canAct(p))p.hold=null;else if(free&&hittable(e)&&!e.armor){const k=p.hold.k;p.hold=null;pop('NA LEVANTADA',p,'#7fd6ff');dashTo(p,'norm',optK(p,k));}}

  if(p.spin&&p.st!=='atk'&&p.st!=='defend'&&p.st!=='intro'&&p.st!=='win'&&!(p.st==='dash'&&p.dash.flank))unspin(p);
  const jm=Math.hypot(inp.x,inp.z);

  switch(p.st){
   case 'idle':case 'block':{
    if(p.st==='block'&&p.t>.35)p.st='idle';

      if(Math.abs(dx)>3||Math.abs(dz)>4){mdx=clamp(dx,-sp*dt,sp*dt);mdz=clamp(dz,-sp*.8*dt,sp*.8*dt);}
    }
    // a passada anda o que o corpo anda de fato (contra a grade o pé não desliza)
    if(mdx||mdz){const nx=clamp(p.x+mdx,-AX,AX),nz=clamp(p.z+mdz,Z0,Z1);if(Math.abs(nx-p.x)+Math.abs(nz-p.z)>1e-4){stepWalk(p,nx-p.x,nz-p.z,dt);moving=true;}p.x=nx;p.z=nz;}
    // histerese: só vira quando o rival passa 6 un. para trás (evita viradas em sequência)
    if(canAct(e)&&Math.abs(e.x-p.x)>4){if((e.x-p.x)*p.face<-6)setFace(p,-p.face);}else if(Math.abs(inp.x)>.2)setFace(p,Math.sign(inp.x));

    p.gw=lerp(p.gw,moving&&p.st==='idle'?1:0,1-Math.exp(-dt*(moving?12:8)));
    if(p.st==='idle'){const ip=idlePose(p);setPose(p,p.gw>.01?lerpPose(ip,walkPose(p,G[p.style],p.hold&&jm<=.15?.7:Math.min(1,jm)),p.gw):ip,moving?260:170,.75);p.lk=.85*p.gw;}

  // fogo do tambor (VISU-10): luz laranja baixa, que esquenta a paleta e acende um rim alaranjado em quem chega perto
  for(const o of PROPS)if(o.fire){const dx=f.x-o.x,dz=(f.z-o.z)*1.5,w=o.fk*.62*Math.exp(-(dx*dx+dz*dz)/4200);if(w<.06)continue;
    L.d.push(dir(o.x,o.h+12,o.z));L.r.push(Math.min(.6,w));L.c.push('#ff9a4a');L.k=Math.min(1,L.k+w*.35);}
  L.lv=Math.round(L.k*16);L.side=Math.sign(LAMPS[L.w[1]>L.w[0]?1:0]-f.x)||1;return L;}
const PAIN={hit:1,hurt:1,stagger:1,countered:1,air:1,down:1,ko:1,held:1,thrown:1},EFFORT={atk:1,strike:1,wind:1,brk:1,dash:1};

// ---------- lutador ----------
// T: ponto do esqueleto (unidades locais) -> pixel do canvas de destino; ps: pixels por unidade; LI: luz (lightOf).
// Cada membro é um grupo desenhado em duas passadas (todos os contornos, depois todos os preenchimentos): sem costuras nas
// articulações; o contorno entre grupos (perna da frente sobre a de trás, braço sobre o tronco) continua. Contorno de 1 px
// em qualquer zoom (VISU-1). Sombreado em 3 tons por plano, voltado para a lâmpada (VISU-4); figurino detalhado (VISU-5)
function drawFighter(c,f,S,T,ps,LI){
  const fl=f.flash>0,mt=f.style==='mt',capo=f.style==='cap',box=STY[f.style].bare&&!mt&&!capo,bare=!!STY[f.style].bare,LP=litPal(f.pal,LI?LI.lv:10),col=k=>fl?'#ffffff':LP[k],ow=1/ps,fc=f.face;
  c.lineCap='round';c.lineJoin='round';
  const mid=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],off=(a,v,k)=>[a[0]+v[0]*k,a[1]+v[1]*k];
  const nrm=(a,b,d)=>{const x=a[0]-b[0],y=a[1]-b[1],l=Math.hypot(x,y);return l>1e-3?[x/l,y/l]:d||[1,0];};
  const path=(pts,cl)=>{c.beginPath();for(let i=0;i<pts.length;i++){const A=T(pts[i]);i?c.lineTo(A[0],A[1]):c.moveTo(A[0],A[1]);}if(cl)c.closePath();};
  const seg=(a,b,w,cl)=>{c.strokeStyle=cl;c.lineWidth=w*ps;path([a,b]);c.stroke();};
  const disc=(a,r,cl)=>{const A=T(a);c.fillStyle=cl;c.beginPath();c.arc(A[0],A[1],r*ps,0,TAU);c.fill();};
  const ell=(a,rx,ry,d,cl)=>{const A=T(a),B=T(off(a,d,1));c.fillStyle=cl;c.beginPath();c.ellipse(A[0],A[1],rx*ps,ry*ps,Math.atan2(B[1]-A[1],B[0]-A[0]),0,TAU);c.fill();};
  const poly=(pts,cl)=>{c.fillStyle=cl;path(pts,1);c.fill();};
  // luz vinda de cima e do lado da lâmpada mais forte, no espaço local
  const Ld=[(LI?LI.side:1)*fc*.6,1];
  // formas de um grupo acrescentadas ao caminho atual, todas no mesmo sentido (horário na tela): um fill só pinta a união
  const capP=(a,b,r)=>{const A=T(a),B=T(b),R=r*ps,t=Math.atan2(B[1]-A[1],B[0]-A[0]);c.moveTo(B[0]+Math.sin(t)*R,B[1]-Math.cos(t)*R);c.arc(B[0],B[1],R,t-PI/2,t+PI/2);c.arc(A[0],A[1],R,t+PI/2,t+PI*1.5);c.closePath();};
  const discP=(a,r)=>{const A=T(a),R=r*ps;c.moveTo(A[0]+R,A[1]);c.arc(A[0],A[1],R,0,TAU);c.closePath();};
  const ellP=(a,rx,ry,d)=>{const A=T(a),B=T(off(a,d,1)),t=Math.atan2(B[1]-A[1],B[0]-A[0]);c.moveTo(A[0]+Math.cos(t)*rx*ps,A[1]+Math.sin(t)*rx*ps);c.ellipse(A[0],A[1],rx*ps,ry*ps,t,0,TAU);c.closePath();};
  const polyP=pts=>{const V=pts.map(T);let ar=0;for(let i=0;i<V.length;i++){const p=V[i],q=V[(i+1)%V.length];ar+=p[0]*q[1]-q[0]*p[1];}if(ar<0)V.reverse();
    c.moveTo(V[0][0],V[0][1]);for(let i=1;i<V.length;i++)c.lineTo(V[i][0],V[i][1]);c.closePath();};
  // grupo: b=osso [a,b,largura,cor,sombreado], d=disco [centro,raio,cor], e=elipse [centro,rx,ry,direção,cor], p=polígono [pontos,cor]
  const Q=[],keyOf=q=>q[0]==='b'?q[4]:q[0]==='d'?q[3]:q[0]==='e'?q[5]:q[2];
  const addQ=(q,e)=>{const t=q[0];if(t==='b')capP(q[1],q[2],q[3]/2+e);else if(t==='d')discP(q[1],q[2]+e);else if(t==='e')ellP(q[1],q[2]+e,q[3]+e,q[4]);else if(!e)polyP(q[1]);};
  // sombra (embaixo, tom médio) e realce (em cima) de um osso, voltados para a luz
  const shadeP=(q,dk)=>{const a=q[1],b=q[2],w=q[3];let nx=a[1]-b[1],ny=b[0]-a[0];const l=Math.hypot(nx,ny);if(l<1e-3)return;nx/=l;ny/=l;if(nx*Ld[0]+ny*Ld[1]<0){nx=-nx;ny=-ny;}
    const o=dk?-.3*w:.27*w;capP([a[0]+nx*o,a[1]+ny*o],[b[0]+nx*o,b[1]+ny*o],dk?.17*w:.12*w);};
  // contorno do grupo inteiro num fill (polígonos: traço), depois cada sequência de mesma cor num fill, com sombra e realce
  const flush=()=>{
    c.fillStyle=OL;c.beginPath();let hp=0;for(const q of Q){if(q[0]==='p')hp=1;addQ(q,ow);}c.fill();
    if(hp){c.strokeStyle=OL;c.lineWidth=2*ow*ps;c.beginPath();for(const q of Q)if(q[0]==='p')polyP(q[1]);c.stroke();}
    for(let i=0,j;i<Q.length;i=j){const k=keyOf(Q[i]);c.beginPath();for(j=i;j<Q.length&&keyOf(Q[j])===k;j++)addQ(Q[j],0);c.fillStyle=col(k);c.fill();
      if(!fl)for(const dk of [1,0]){const C=dk?LP[k+'M']||LP[k+'D']:LP[k+'H'];if(!C)continue;let n=0;c.beginPath();for(let x=i;x<j;x++)if(Q[x][0]==='b'&&Q[x][5]){shadeP(Q[x],dk);n++;}if(n){c.fillStyle=C;c.fill();}}}
    Q.length=0;};
  // tecido: vetor da mola (mundo) no espaço local, normalizado
  const C=f.cl,cl0=C?Math.hypot(C[0],C[1]):0,cv=cl0>.15?[C[0]/cl0*fc,C[1]/cl0]:[-.3,-.95],cp=[-cv[1],cv[0]];
  const arm=(r0,el,ha,dk)=>{
    const sk=dk?'skinD':'skin',dir=nrm(ha,el);
    if(capo){Q.push(['d',r0,2.9,sk],['b',r0,el,4.6,sk,!dk],['b',el,ha,4.1,sk,!dk],['d',ha,2.3,sk]);flush();return;}
    if(mt){
      // braço nu com a corda do braço (prajioud) e a mão enfaixada com cordas cruzadas
      const g0=off(ha,dir,.3),pn=[-dir[1],dir[0]],up=pn[0]*Ld[0]+pn[1]*Ld[1]>0?pn:[dir[1],-dir[0]],w1=mid(el,ha,.38);
      Q.push(['d',r0,2.9,sk],['b',r0,el,4.7,sk,!dk],['b',el,ha,4.2,sk,!dk],['b',mid(r0,el,.2),mid(r0,el,.42),5.4,dk?'ropeD':'rope',0],['b',w1,ha,4.4,dk?'wrapD':'wrap',0],['e',g0,3.1,2.7,dir,dk?'wrapD':'wrap']);flush();
      if(!fl&&!dk){for(let k=0;k<4;k++){const t=.45+k*.15,a=mid(el,ha,t);seg(off(a,up,2.2),off(mid(el,ha,t+.12),up,-2.2),.55,col('wrapD'));}
        seg(off(mid(r0,el,.2),up,2.5),off(mid(r0,el,.42),up,-2.5),.5,col('ropeD'));disc(off(off(g0,up,1.2),dir,.6),.8,col('glH'));}
      return;}
    if(box){const g0=off(ha,dir,.5),pn=[-dir[1],dir[0]],up=pn[0]*Ld[0]+pn[1]*Ld[1]>0?pn:[dir[1],-dir[0]];
      Q.push(['d',r0,2.7,sk],['b',r0,el,4.4,sk,!dk],['b',el,ha,4,sk,!dk],['b',mid(el,ha,.58),mid(el,ha,.84),4.8,dk?'trimD':'trim',0],['e',g0,4.1,3.4,dir,dk?'glD':'gl']);flush();
      // luva: sombra embaixo, brilho em cima e a costura do polegar; cadarço no punho de perto
      if(!fl&&!dk){ell(off(g0,up,-1.2),3,1.6,dir,col('glD'));ell(off(off(g0,up,.4),dir,-.2),3.2,2.2,dir,col('gl'));
        disc(off(off(g0,up,1.5),dir,.9),1,col('glH'));seg(off(off(g0,up,-.6),dir,-1.6),off(off(g0,up,-1.1),dir,1.6),.7,col('glD'));
        if(ps>1.6){const a=mid(el,ha,.66),b=mid(el,ha,.78);seg(off(a,up,1.6),off(b,up,-1.6),.45,OL);seg(off(a,up,-1.6),off(b,up,1.6),.45,OL);}}}
    else{const m=mid(el,ha,.6),g=dk?'giD':'gi';
      // a mão e o antebraço saem de dentro da manga (desenhados antes dela); manga mais larga no fim, com barra
      Q.push(['d',r0,2.8,g],['b',r0,el,4.6,g,!dk],['b',m,ha,3,sk,!dk],['d',ha,2,sk],['b',el,m,4.4,g,!dk],['b',mid(el,m,.45),m,5.3,g,0]);
      if(!dk)Q.push(['b',mid(el,m,.9),m,5.3,'giM',0]);flush();}
  };
  const leg=(kn,an,toe,dk)=>{const h=S.hip,sk=dk?'skinD':'skin',sd=nrm(an,kn,[0,-1]);
    if(mt){const m1=mid(h,kn,.55),a1=mid(kn,an,.74);
      Q.push(['b',an,toe,3.1,sk,0],['b',h,m1,7.2,dk?'shD':'sh',!dk],['b',m1,kn,5.5,sk,!dk],['b',kn,an,4.8,sk,!dk],['b',a1,mid(a1,an,.72),4.5,dk?'ropeD':'rope',0]);flush();
      if(!fl){seg(mid(h,m1,.3),mid(h,m1,.97),1.2,col(dk?'trimD':'trim'));seg(off(mid(kn,an,.1),Ld,.7),off(mid(kn,an,.55),Ld,.7),.9,col('skinH'));
        for(let k=0;k<3;k++){const a=mid(a1,an,.15+k*.25);seg(off(a,sd,2.2),off(a,sd,-2.2),.5,col('wrapD'));}}
      return;}
    if(box){const m1=mid(h,kn,.55),m2=mid(kn,an,.56),bt=dk?'bootD':'boot';
      Q.push(['b',h,m1,7,dk?'shD':'sh',!dk],['b',m1,kn,5.3,sk,!dk],['b',kn,m2,4.6,sk,!dk],['b',mid(kn,m2,.78),m2,4.7,dk?'trimD':'trim',0],['b',m2,an,5.1,bt,0],['b',an,toe,3.5,bt,0]);flush();
      if(!fl){// faixa lateral do calção, brilho do cano da bota e sola clara
        seg(mid(h,m1,.3),mid(h,m1,.97),1.1,col(dk?'trimD':'trim'));
        if(!dk)seg(off(mid(m2,an,.15),Ld,.9),off(mid(m2,an,.8),Ld,.9),1,col('bootH'));
        const fd=nrm(toe,an);let s2=[fd[1],-fd[0]];if(s2[0]*sd[0]+s2[1]*sd[1]<0)s2=[-s2[0],-s2[1]];
        seg(off(off(an,s2,1.2),fd,-.6),off(toe,s2,1.2),1.1,col(dk?'trimD':'sole'));}}
    else{const g=dk?'giD':'gi',e=mid(kn,an,.86);
      // pé descalço por baixo da barra; calça mais larga no último terço, com a barra mais escura
      Q.push(['b',an,toe,2.8,sk,0],['b',h,kn,6.2,g,!dk],['b',kn,e,5.4,g,!dk],['b',mid(kn,an,.55),e,6.4,g,0]);if(!dk)Q.push(['b',mid(kn,an,.8),e,6.4,'giM',0]);flush();}
  };
  // tronco com 9 pontos (cintura, peito, ombros caindo até o pescoço, dorsal), pescoço por baixo e sombreado por plano
  const tp=[S.hF,S.wF,S.cF,S.sF,S.tF,S.tB,S.sB,S.dB,S.hB],sp=nrm(S.sh,S.hip,[0,1]),hw=[S.hF[0]-S.hB[0],S.hF[1]-S.hB[1]];
  // ponto do tronco pela altura h (0 quadril, 1 ombro) e profundidade u (0 frente, 1 costas): o sombreado fica sempre dentro
  // do polígono, mesmo com o tronco estreitado pelo giro (sem recorte)
  const tf=h=>h<.35?mid(S.hF,S.wF,h/.35):h<.76?mid(S.wF,S.cF,(h-.35)/.41):mid(S.cF,S.sF,(h-.76)/.24),tb=h=>h<.66?mid(S.hB,S.dB,h/.66):mid(S.dB,S.sB,(h-.66)/.34);
  const tpt=(h,u)=>mid(tf(h),tb(h),u);
  const trunks=()=>{poly([tpt(0,1),tpt(.3,1),tpt(.3,0),tpt(0,0)],col('sh'));if(!fl)poly([tpt(0,1),tpt(.3,1),tpt(.3,.72),tpt(0,.7)],col('shD'));
    poly([tpt(.2,1),tpt(.32,1),tpt(.32,0),tpt(.2,0)],col('trim'));};
  const torso=()=>{
    Q.push(['b',S.sh,S.nk,3.8,'skin',0]);flush();
    c.lineWidth=2*ow*ps;c.strokeStyle=OL;path(tp);c.stroke();poly(tp,col(bare?'skin':'gi'));
    if(!fl){poly([tpt(1,1),tpt(.66,1),tpt(0,1),tpt(0,.68),tpt(.66,.7),tpt(1,.74)],col(bare?'skinM':'giM'));
      if(bare){seg(tpt(.69,.08),tpt(.72,.42),.8,col('skinD'));seg(tpt(.8,.14),tpt(.88,.42),1.2,col('skinH'));
        for(const h of [.4,.5,.6])seg(tpt(h,.12),tpt(h,.24),.7,col('skinD'));
        seg(tpt(.93,.1),tpt(.42,.1),.8,col('skinH'));}
      else{const A=tpt(.96,.62),B=tpt(.3,.12);seg(mid(A,B,.02),B,1.4,col('giH'));seg(off(A,hw,-.08),off(B,hw,-.08),.8,col('lap'));seg(tpt(.93,.12),tpt(.45,.12),.9,col('giH'));}}
    if(bare&&!capo)trunks();
  };
  // depois da perna da frente: o calção (boxe) ou a saia do dobok com a faixa (tkd) cobrem a raiz da coxa sem costura
  const hipOver=()=>{
    if(capo){
      // abadá: cós branco sobre o quadril e o cordão da graduação amarrado com as pontas soltas
      const sk=[tpt(0,1),tpt(.27,1),tpt(.27,0),tpt(0,0)];c.lineWidth=2*ow*ps;c.strokeStyle=OL;path(sk,1);c.stroke();poly(sk,col('gi'));
      if(!fl)poly([tpt(0,1),tpt(.27,1),tpt(.27,.7),tpt(0,.7)],col('giM'));
      const k0=mid(off(S.hF,sp,.9),off(S.hB,sp,.9),.06),t1=off(off(k0,cv,5),cp,.5),t2=off(off(k0,cv,4),cp,-.6);
      Q.push(['b',off(S.hB,sp,.9),off(S.hF,sp,.9),2.2,'belt',0],['b',k0,t1,1.3,'belt',0],['b',k0,t2,1.1,'belt',0],['d',k0,1.3,'belt']);flush();return;}
    if(bare){trunks();return;}
    const a=tpt(.22,1),e=tpt(.22,0),b=off(off(S.hB,sp,-4.8),hw,-.12),d=off(off(S.hF,sp,-4.8),hw,.1),sk=[a,S.hB,b,d,S.hF,e];
    c.lineWidth=2*ow*ps;c.strokeStyle=OL;path(sk);c.stroke();poly(sk,col('gi'));
    if(!fl){poly([b,d,mid(d,S.hF,.24),mid(b,S.hB,.24)],col('giM'));poly([a,S.hB,b,mid(b,d,.3),mid(S.hB,S.hF,.3),mid(a,e,.3)],col('giM'));}
    const k0=mid(off(S.hF,sp,.9),off(S.hB,sp,.9),.06),t1=off(off(k0,cv,5),cp,.5),t2=off(off(k0,cv,4),cp,-.6);
    Q.push(['b',off(S.hB,sp,.9),off(S.hF,sp,.9),2.2,'belt',0],['b',k0,t1,1.3,'belt',0],['b',k0,t2,1.1,'belt',0],['d',k0,1.3,'belt']);flush();
  };
  const head=()=>{
    const ha=S.ha,u=[Math.sin(ha),Math.cos(ha)],fw=[Math.cos(ha)*S.dirS,-Math.sin(ha)*S.dirS],h=S.hd;
    const sc=S.hsc,at0=(a,b)=>[h[0]+fw[0]*a*HS+u[0]*b*HS,h[1]+fw[1]*a*HS+u[1]*b*HS],at=(a,b)=>at0(a*sc,b);
    const arc=(r,t0,t1,n)=>{const o=[];for(let i=0;i<=n;i++){const t=t0+(t1-t0)*i/n;o.push(at(Math.cos(t)*r,Math.sin(t)*r));}return o;};
    // cabelo por estilo: boxeador curto e rente; taekwondista com franja e uma mecha atrás presa à mola do tecido
    const hair=bare?[...arc(5.35,.95,3.75,9),at(-2.9,-1.7),at(-1.3,1),at(1.9,2.8)]
      :[at(-2.6,-1.6),...arc(5.75,3.85,.5,11),at(5.5,1.9),at(4,2.5),at(3.1,1.7),at(1.4,2.7),at(-1.3,1)];
    if(!box){const r0=at(-4.6,1.3),r1=at(-4,-1.8),tip=off(at(-4.7,-.4),cv,5);Q.push(['p',[r0,tip,r1],'hair']);}
    Q.push(['d',h,5*HS,'skin'],['d',at(2.5,-3.1),1.7*HS,'skin'],['d',at(4.6,-.5),1.05*HS,'skin'],['p',hair,'hair']);flush();
    if(!fl){
      seg(at(-1.4,-3.5),at(1.5,-3.9),1,col('skinM'));
      disc(at(-.9,-.5),.95,col('skinM'));if(ps>1.6)disc(at(-.8,-.5),.4,col('skinD'));
      if(ps>1.4){c.strokeStyle=col('hairH');c.lineWidth=Math.max(1,.8*ps);path(arc(box?4.5:4.8,1.3,2.3,4));c.stroke();}
      const pain=PAIN[f.st]||f.fl>0,eff=EFFORT[f.st],px=(q,w,hh,cl)=>{const A=T(q),pw=Math.max(1,Math.round(w*ps)),ph=Math.max(1,Math.round(hh*ps));c.fillStyle=cl;c.fillRect(Math.round(A[0]-pw/2),Math.round(A[1]-ph/2),pw,ph);};
      px(at(3.15,.5),1,pain?.6:1.2,OL);
      const bw=Math.max(.7,1/ps);
      if(eff)seg(at(2.3,2.6),at(4.1,1.8),bw,OL);else if(pain)seg(at(2.3,1.9),at(4.1,2.5),bw,OL);else seg(at(2.3,2.3),at(4.1,2.1),bw,OL);
      if(pain){seg(at(3.8,-1.8),at(3.9,-2.9),1.2,OL);if(box)seg(at(3.75,-1.85),at(3.85,-2.25),.8,'#f4f1e8');}
      else seg(at(3.3,-2.4),at(4.3,-2.2),.7,col('skinD'));
      px(at(4.9,-.2),.9,.9,col('skinH'));
      if(f.fl>0){px(at(3.9,-2.9),1.7,1.5,'#2a0508');px(at(4,-2.6),1.1,.45,'#f4f1e8');}
      if(LP.band){const k0=at(-4.7,2.9),t1=off(off(k0,cv,5),cp,.5),t2=off(off(k0,cv,4),cp,-.8);
        Q.push(['b',k0,at(3.7,3.3),1.8,'band',0],['b',k0,t1,1.4,'band',0],['b',k0,t2,1.1,'band',0],['d',k0,1.3,'band']);flush();}}
  };
  const swap=S.swap;
  const legB=()=>swap?leg(S.fk,S.ff,S.ft,true):leg(S.bk,S.bf,S.bt,true);
  const legF=()=>swap?leg(S.bk,S.bf,S.bt,false):leg(S.fk,S.ff,S.ft,false);
  const swU=S.swapU;
  const armB=()=>swU?arm(S.aF,S.fe,S.fh,true):arm(S.aB,S.be,S.bh,true);
  const armF=()=>swU?arm(S.aB,S.be,S.bh,false):arm(S.aF,S.fe,S.fh,false);
  if(S.armSwap&&!swU){legB();torso();armB();legF();hipOver();head();armF();}
  else{armB();legB();torso();legF();hipOver();head();armF();}
}
// ---------- sprite do lutador (VISU-13) ----------
// Cada lutador é desenhado num canvas próprio já na grade de pixels da tela (mesma rotação e escala da câmera, origem
// inteira) e tem o alfa das bordas endurecido por composição (sem meio-tom: pixel art nítido, contorno de 1 px). Acima de
// ~2.5 px por unidade o sprite sai numa resolução inteira menor (m=2,3) e é ampliado sem suavização: pixels grossos e
// estáveis no close, em vez de um boneco liso. O rim light das lâmpadas e o gradiente vertical entram por cima (VISU-2)
// Endurecer o alfa: filtro SVG de limiar (uma passada, testado uma vez no início); sem suporte a filtro no canvas, 8
// composições do sprite sobre ele mesmo (a²: destination-in; 2a-a²: source-over) aproximam o mesmo degrau

const TRB={bags:[{x:-440,z:440,ph:0,h:62},{x:-260,z:480,ph:1.3,h:70},{x:-70,z:450,ph:2.1,h:66},{x:120,z:490,ph:.7,h:72},{x:300,z:450,ph:3.2,h:64},{x:480,z:430,ph:4,h:68},{x:-380,z:290,ph:5.1,h:62},{x:392,z:296,ph:2.6,h:62}],
 dum:[{x:-540,z:395},{x:-350,z:372},{x:-170,z:362},{x:50,z:374},{x:230,z:366},{x:430,z:386},{x:-450,z:310},{x:450,z:318}]};
function trainBag(b){
  const ang=Math.sin(time*1.15+b.ph)*.045+Math.sin(time*2.3+b.ph*2)*.01,off=y=>ang*(260-y),r=9.5,yt=104,yb=104-b.h*.8;

  ctx.strokeStyle='#8f97a3';ctx.lineWidth=.7;ctx.stroke();
  const N=7,L=[],R=[];for(let i=0;i<=N;i++){const y=yt-(yt-yb)*i/N,k=1-.12*Math.pow(2*i/N-1,4),o=off(y);L.push([b.x-r*k+o,y,b.z]);R.push([b.x+r*k+o,y,b.z]);}
  polyW(L.concat(R.reverse()),'#6b3f24');

  const strip=(f0,f1,col)=>{const A=[],B=[];for(let i=0;i<=N;i++){const y=yt-(yt-yb)*i/N,k=1-.12*Math.pow(2*i/N-1,4),o=off(y);A.push([b.x+(-1+2*f0)*r*k+o,y,b.z]);B.push([b.x+(-1+2*f1)*r*k+o,y,b.z]);}polyW(A.concat(B.reverse()),col);};
  strip(.1,.32,'#9a6a43');strip(.72,1,'#4a2a16');

  const o=off(yt);polyW([[b.x-r*.55+o,yt+3,b.z],[b.x+r*.55+o,yt+3,b.z],[b.x+r*.4+o,yt,b.z],[b.x-r*.4+o,yt,b.z]],'#3a3f47');
}

// ================= LUA (cenário 5): solo lunar, a Terra azul ao longe e um buraco negro perto =================
// Céu preto com estrelas que cintilam e uma faixa da Via Láctea; a Terra pequena e distante (oceanos, continentes e nuvens que giram
// devagar, noite à direita e brilho da atmosfera); um buraco negro com disco de acreção girando, anel de luz curvada e a sombra no
// centro; chão cinza com crateras, rochas e pegadas; sol duro e sem ar: sombras longas e pretas. Aparece sorteado entre os rounds.
function buildMoon(){
  const R=seeded(404),st=[],cr=[],rk=[],du=[],fp=[],mt=[],ac=[];
  for(let i=0;i<420;i++)st.push({x:R(-3300,3300),y:R(-200,1100),z:R(2400,3600),m:R(0,1),f:R(.6,3),ph:R(0,6),c:R(0,1)});
  for(let i=0;i<34;i++)cr.push({x:R(-820,820),z:R(70,700),r:R(12,64)});
  for(let i=0;i<50;i++)rk.push({x:R(-860,860),z:R(70,720),s:R(3,12),c:R(0,1),k:R(0,1)});
  for(let i=0;i<700;i++)du.push({x:R(-960,960),z:R(30,920),c:R(0,1)});
  for(let i=0;i<9;i++)fp.push({x:-150+i*16,z:268+Math.sin(i*1.4)*9,s:i%2});
  for(let i=0;i<28;i++)mt.push({x:-1700+i*125+R(-30,30),h:R(26,100),w:R(90,190)});
  for(let i=0;i<90;i++)ac.push({a:R(0,TAU),r:R(.55,1),v:R(.5,1.6),s:R(.6,1.6),c:R(0,1)});
  return {st,cr,rk,du,fp,mt,ac};
}

function drawBlackHole(){

  // disco de acreção visto de lado: anéis do laranja ao branco, mais quentes por dentro
  for(const [k,col,w] of [[1,'rgba(255,90,20,.35)',R*.1],[.88,'rgba(255,140,40,.55)',R*.09],[.76,'rgba(255,190,90,.75)',R*.07],[.64,'rgba(255,230,170,.9)',R*.05],[.55,'rgba(255,250,235,.95)',R*.03]])ell(R*k,R*k*.26,col,w,0,TAU);

// meteoritos: riscos de luz com cauda cruzando o céu de tempos em tempos, uns pequenos e rápidos e dois grandes e lentos com rocha e brilho

      ctx.fillStyle=`rgba(120,100,90,${al})`;ctx.beginPath();ctx.moveTo(hx-6,hy2-2);ctx.lineTo(hx-2,hy2-7);ctx.lineTo(hx+5,hy2-5);ctx.lineTo(hx+7,hy2+2);ctx.lineTo(hx+1,hy2+6);ctx.lineTo(hx-5,hy2+4);ctx.closePath();ctx.fill();

function drawMoonBG(){

  // via láctea: faixa diagonal de poeira de luz
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<8;i++){const q=P(-1500+i*430,230+i*85,3200),r=520*q[2];ctx.fillStyle='rgba(140,160,255,.04)';ctx.beginPath();ctx.ellipse(q[0],q[1],r*1.8,r*.5,-.45,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,210,170,.025)';ctx.beginPath();ctx.ellipse(q[0]+r*.3,q[1]-r*.1,r*1.1,r*.3,-.45,0,TAU);ctx.fill();}
  ctx.globalCompositeOperation='source-over';
  // estrelas cintilando
  for(const s of S.st){const q=P(s.x,s.y,s.z);if(q[0]<CAM.vb[0]-4||q[0]>CAM.vb[2]+4||q[1]>gy)continue;
    ctx.globalAlpha=(.3+.7*s.m)*(.55+.45*Math.sin(time*s.f+s.ph));ctx.fillStyle=s.c<.15?'#bcd0ff':s.c>.85?'#ffe2b8':'#ffffff';
    const w=s.m>.93?2:1;ctx.fillRect(Math.round(q[0]),Math.round(q[1]),w,w);}
  ctx.globalAlpha=1;

  for(const m of S.mt){const a=P(m.x-m.w*.5,0,wz),b=P(m.x+m.w*.5,0,wz),c=P(m.x,m.h*.45,wz-30);
    ctx.fillStyle='#4a4d5e';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(b[0],b[1]);ctx.fill();

// ROSTO dos cartões: o sprite real do lutador em pose neutra, recortado na cabeça (mesma arte do jogo)
function faceCard(id,style){
  const f=mkF(style,true,palFor(style,0,true),0,Z0),P=[0,0,.2,.3,.2,.3,.1,-.1,-.1,-.1];f.pose=P.slice();f.pt=P.slice();
  const T=document.createElement('canvas');T.width=T.height=220;const t=T.getContext('2d');t.imageSmoothingEnabled=false;
  const r=fighterSprite(f,skel(f),[1,0,0,1,0,0],110,205,2.6,PVL);t.drawImage(r.c,0,0,r.w,r.h,r.ox,r.oy,r.w*r.m,r.h*r.m);
  const d=t.getImageData(0,0,220,220).data;let y0=-1,y1=-1;
  for(let y=0;y<220&&y1<0;y++)for(let x=0;x<220;x++)if(d[(y*220+x)*4+3]>40){if(y0<0)y0=y;break;}
  // centro da cabeça: média dos pixels opacos nas primeiras linhas do corpo
  let sx=0,n=0;for(let y=y0;y<y0+22;y++)for(let x=0;x<220;x++)if(d[(y*220+x)*4+3]>40){sx+=x;n++;}
  const cx=n?sx/n:110,side=46,c=$(id).getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,56,56);
  const g=c.createRadialGradient(28,34,2,28,34,34);g.addColorStop(0,'rgba(242,169,59,.30)');g.addColorStop(1,'rgba(242,169,59,0)');c.fillStyle=g;c.fillRect(0,0,56,56);
  c.drawImage(T,cx-side/2,y0-5,side,side,0,0,56,56);
}
// PAINEL do lutador (estilo seleção de personagens): nome e estilo em cima e, embaixo, a animação dele golpeando em tamanho grande

function showPanel(n,F){const p=PAN[n];p.dummy=!!(F&&F.dummy);$('pn'+n+'n').textContent=F?F.n:'?';$('pn'+n+'s').textContent=F?F.t:'escolha';$('pn'+n).classList.toggle('on',!!F);if((F&&F.s)!==p.style){p.style=F?F.s:null;p.f=null;}}
function panelLoop(){
  const st=[null,{mt:0,mv:null,li:0,pt:performance.now()},{mt:0,mv:null,li:0,pt:performance.now()}];
  (function draw(now){
    if($('menu').hidden)return;
    if($('pickView').hidden){requestAnimationFrame(draw);return;}
    for(const n of [1,2]){const p=PAN[n],q=st[n],cv=$('pn'+n+'c'),c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,180,150);
      if(!p.style){c.font='300 96px Jost, Arial, sans-serif';c.textAlign='center';c.fillStyle='rgba(239,230,210,.16)';c.fillText('?',90,112);continue;}
      if(!p.f){p.f=mkF(p.style,n===1,palFor(p.style,0,n===1),0,Z0);if(p.dummy)Object.assign(p.f.pal,WOODPAL);q.mt=0;q.mv=null;q.li=0;q.last=now;p.list=SEQ[p.style].flat();}
      const f=p.f,dt=Math.min(.05,((now||q.pt)-(q.last||now||q.pt))/1000);q.last=now;q.mt+=dt;
      if(!q.mv&&q.mt>.7&&!p.dummy){q.mv=MOV[p.style][p.list[q.li++%p.list.length]];q.mt=0;f.ki=-1;f.st='atk';f.mv=q.mv;}
      if(q.mv){const mv=q.mv;let ki=0;for(let i=0;i<mv.keys.length;i++)if(q.mt>=mv.keys[i][0])ki=i;if(ki!==f.ki){f.ki=ki;setPose(f,mv.keys[ki][1],mv.keys[ki][2],mv.keys[ki][3]);}
        f.spin=spinAt(mv,q.mt);f.rot=rotAt(mv,q.mt);f.tw=mv.tw?mv.tw*(q.mt<mv.h0?eout(clamp(q.mt/mv.h0,0,1)):1-ease(clamp((q.mt-mv.h0)/(mv.d-mv.h0),0,1))):0;f.twS=mv.twS;
        f.y=mv.jump?Math.sin(Math.min(1,q.mt/(mv.d*.85))*PI)*mv.jump*.6:0;
        if(q.mt>=mv.d){q.mv=null;q.mt=0;f.spin=0;f.rot=0;f.y=0;f.st='idle';}}
      else setPose(f,idlePose(f),170,.75);
      phys(f,dt);f.x=0;f.z=Z0;
      const g=c.createRadialGradient(90,138,4,90,138,80);g.addColorStop(0,n===1?'rgba(255,255,255,.22)':'rgba(77,163,255,.26)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,180,150);
      c.fillStyle='rgba(0,0,0,.5)';c.beginPath();c.ellipse(90,146,32,5,0,0,TAU);c.fill();
      const r=fighterSprite(f,skel(f),[1,0,0,1,0,0],90,146,2.1,PVL);c.drawImage(r.c,0,0,r.w,r.h,r.ox,r.oy,r.w*(r.m||1),r.h*(r.m||1));}
    requestAnimationFrame(draw);})();
}

// cenário do fundo do menu: sorteado entre os quatro (subsolo, cidade, ilha e centro de treino) a cada vez, sem repetir o anterior
let lastMenuStage=-1,menuBag=[];
// saco embaralhado: os cinco cenários aparecem todos antes de qualquer um repetir
// o último cenário também fica guardado no aparelho: ao abrir o jogo do zero ele nunca repete o da visita anterior
function menuStage(){
  if(lastMenuStage<0){try{const v=parseInt(localStorage.getItem('fb_menuStage'));if(v>=0&&v<5)lastMenuStage=v;}catch(e){}}
  if(!menuBag.length||menuBag[menuBag.length-1]===lastMenuStage){menuBag=shuffle([0,1,2,3,4]);if(menuBag[menuBag.length-1]===lastMenuStage)menuBag.reverse();}
  const n=menuBag.pop();lastMenuStage=n;try{localStorage.setItem('fb_menuStage',String(n));}catch(e){}setStage(n);}
